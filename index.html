<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Psicosocial - Retro Game</title>
    <style>
        body {
            background-color: #111;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 500px;
            background: #222;
            border: 4px solid #f0f;
            margin: 0 auto;
            overflow: hidden;
        }
        /* HUD Superior estilo Arcade */
        .hud {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 10px;
            font-size: 14px;
            border-bottom: 2px solid #0ff;
        }
        /* Pantalla de Preguntas (Modal) */
        #question-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-option {
            display: block;
            width: 100%;
            background: #333;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 10px;
            margin: 10px 0;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-option:hover {
            background: #0ff;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>RETRO APPS ARCADE</h1>
    
    <div id="game-container">
        <!-- Panel superior tipo arcade -->
        <div class="hud">
            <span>SCORE: <b id="score">0</b></span>
            <span>SPEED: <b id="speed">120</b> mph</span>
        </div>

        <!-- Área de juego / carretera simulada -->
        <div id="canvas-area" style="position: relative; height: 400px;">
            <div id="car" style="position: absolute; bottom: 20px; left: 180px; font-size: 30px;">🏎️</div>
            <div id="coin" style="position: absolute; top: 50px; left: 190px; font-size: 24px; cursor: pointer;" onclick="triggerQuestion()">🪙</div>
        </div>

        <!-- Ventana Modal de Preguntas -->
        <div id="question-modal">
            <h3 id="q-text">¿Qué teoría destaca el andamiaje?</h3>
            <button class="btn-option" onclick="checkAnswer(true)">A) Lev Vygotsky</button>
            <button class="btn-option" onclick="checkAnswer(false)">B) Condicionamiento clásico</button>
        </div>
    </div>

    <script>
        let score = 0;

        function triggerQuestion() {
            // Pausa el juego y muestra la pregunta al alcanzar la moneda
            document.getElementById('question-modal').style.display = 'block';
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                score += 100;
                document.getElementById('score').innerText = score;
                alert('¡Correcto! +100 Puntos');
            } else {
                alert('¡Incorrecto!');
            }
            // Oculta la pregunta y reanuda el juego
            document.getElementById('question-modal').style.display = 'none';
            // Reposiciona la moneda aleatoriamente
            document.getElementById('coin.style.left = (Math.random() * 300) + 'px';
        }
    </script>

</body>
</html>
