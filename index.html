<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Psicosocial - Retro Game</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 20px;
            margin: 10px 0;
            color: #f0f;
            text-shadow: 2px 2px #0ff;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 480px;
            background: #1a1a24;
            border: 4px solid #0ff;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        /* HUD Superior estilo Arcade */
        .hud {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 8px;
            font-size: 14px;
            border-bottom: 2px solid #0ff;
            font-weight: bold;
        }
        /* Área de la pista */
        #track-area {
            position: relative;
            width: 100%;
            height: 330px;
            background: linear-gradient(to bottom, #111 0%, #333 100%);
        }
        #car {
            position: absolute;
            bottom: 10px;
            left: 180px;
            font-size: 32px;
            transition: left 0.05s linear;
        }
        #coin {
            position: absolute;
            top: 20px;
            left: 190px;
            font-size: 26px;
        }
        /* Botones táctiles WAP (Móvil) */
        .touch-controls {
            display: flex;
            justify-content: space-between;
            background: #000;
            padding: 10px 20px;
            border-top: 2px solid #0ff;
        }
        .btn-dir {
            background: #222;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-dir:active {
            background: #0ff;
            color: #000;
        }
        /* Ventana Modal de Preguntas */
        #question-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            text-align: left;
        }
        #question-modal h3 {
            color: #ff0;
            font-size: 15px;
            text-align: center;
        }
        .btn-option {
            display: block;
            width: 100%;
            background: #222;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 8px;
            margin: 8px 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            border-radius: 4px;
        }
        .btn-option:hover {
            background: #0ff;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>ARCADE APPS - PSICOSOCIAL</h1>
    
    <div id="game-container">
        <!-- Panel superior -->
        <div class="hud">
            <span>SCORE: <b id="score">0</b></span>
            <span>SPEED: <b id="speed">120</b> mph</span>
        </div>

        <!-- Pista de juego -->
        <div id="track-area">
            <div id="coin">🪙</div>
            <div id="car">🏎️</div>
        </div>

        <!-- Controles táctiles para móvil (WAP) -->
        <div class="touch-controls">
            <button class="btn-dir" ontouchstart="moveCar(-30)" onclick="moveCar(-30)">◀</button>
            <button class="btn-dir" ontouchstart="moveCar(30)" onclick="moveCar(30)">▶</button>
        </div>

        <!-- Modal de Preguntas del Temario -->
        <div id="question-modal">
            <h3 id="q-title">¡Moneda conseguida! Responde:</h3>
            <p id="q-text" style="font-size: 13px; font-weight: bold;"></p>
            <div id="options-container"></div>
        </div>
    </div>

    <script>
        let score = 0;
        let carPos = 180; // Posición horizontal inicial del coche
        let coinPos = 190;
        let coinTop = 20;
        let gameActive = true;

        // Banco de preguntas del temario
        const questions = [
            {
                q: "¿Qué teoría destaca el andamiaje y la Zona de Desarrollo Próximo?",
                options: ["A) Lev Vygotsky", "B) Ivan Pávlov", "C) Jean Piaget"],
                correct: 0
            },
            {
                q: "¿Qué tipo de motivación se debe activar para lograr cambios duraderos?",
                options: ["A) Motivación biológica pura", "B) Motivación secundaria (logro/autorrealización)", "C) Estímulos de castigo"],
                correct: 1
            },
            {
                q: "En personas con demencia, ¿cuál es un obstáculo clave para el aprendizaje?",
                options: ["A) Memoria prodigiosa", "B) Pérdida de memoria y apatía", "C) Exceso de velocidad mental"],
                correct: 1
            }
        ];
        let currentQ = 0;

        // Control por teclado (Versión Web)
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft') moveCar(-25);
            if (e.key === 'ArrowRight') moveCar(25);
        });

        function moveCar(val) {
            if (!gameActive) return;
            carPos += val;
            // Limitar los bordes de la pista
            if (carPos < 10) carPos = 10;
            if (carPos > 340) carPos = 340;
            document.getElementById('car').style.left = carPos + 'px';
        }

        // Bucle principal de movimiento de la moneda
        function updateGame() {
            if (gameActive) {
                coinTop += 2; // Velocidad de caída de la moneda
                if (coinTop > 280) {
                    // Comprobar colisión simple horizontal
                    if (Math.abs(carPos - coinPos) < 35) {
                        triggerQuestion();
                    }
                    // Reiniciar moneda arriba en posición aleatoria
                    if (coinTop > 300) {
                        coinTop = 20;
                        coinPos = Math.floor(Math.random() * 320) + 20;
                        document.getElementById('coin').style.left = coinPos + 'px';
                    }
                }
                document.getElementById('coin').style.top = coinTop + 'px';
            }
            requestAnimationFrame(updateGame);
        }

        function triggerQuestion() {
            gameActive = false;
            let qData = questions[currentQ];
            document.getElementById('q-text').innerText = qData.q;
            
            let htmlOptions = '';
            qData.options.forEach((opt, index) => {
                htmlOptions += `<button class="btn-option" onclick="checkAnswer(${index})">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = htmlOptions;
            document.getElementById('question-modal').style.display = 'block';
        }

        function checkAnswer(selected) {
            let qData = questions[currentQ];
            if (selected === qData.correct) {
                score += 200;
                document.getElementById('score').innerText = score;
                alert('¡Correcto! +200 Puntos');
            } else {
                alert('¡Fallaste!');
            }
            
            // Siguiente pregunta rotativa
            currentQ = (currentQ + 1) % questions.length;
            
            // Ocultar modal y reactivar juego
            document.getElementById('question-modal').style.display = 'none';
            coinTop = 20;
            coinPos = Math.floor(Math.random() * 320) + 20;
            document.getElementById('coin').style.left = coinPos + 'px';
            gameActive = true;
        }

        // Iniciar bucle
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
